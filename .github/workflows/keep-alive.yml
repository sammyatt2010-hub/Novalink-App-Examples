name: Keep Streamlit app awake

on:
  schedule:
    # Every 3 hours (Streamlit sleeps apps after a period with no visits)
    - cron: "47 */3 * * *"
  workflow_dispatch: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://novalink-app-examples-app.streamlit.app/
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright (Chromium)
        run: |
          npm init -y > /dev/null
          npm install playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: Visit the app and wake it if asleep
        run: |
          cat > wake.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const url = process.env.APP_URL;
            console.log('Visiting ' + url);
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(8000);
            const btn = page.getByRole('button', { name: /get this app back up/i });
            if (await btn.count() > 0) {
              console.log('App was asleep - clicking wake button');
              await btn.first().click();
              await page.waitForTimeout(60000);
            } else {
              console.log('App is awake');
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          EOF
          node wake.js
